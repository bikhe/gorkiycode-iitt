<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Gorky AI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a181b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..700&family=Pixelify+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="/assets/base.css">
<style>
  body { min-height: 100svh; display: flex; flex-direction: column; background: #140a2e; }
  main { flex: 1; display: grid; place-content: center; justify-items: center; gap: var(--s-300); padding: var(--s-900) var(--s-200) var(--s-400); text-align: center; }
  .code { font-family: var(--font-px); font-size: var(--text-7xl); line-height: 1; color: var(--violet-hi); }
  h1 { font-size: var(--text-3xl); line-height: var(--lh-3xl); }
  p { color: var(--ink-2); max-width: 480px; }
  .links { display: flex; flex-wrap: wrap; gap: var(--s-200); justify-content: center; align-items: center; }
  img { width: 100%; height: auto; min-height: 200px; object-fit: cover; object-position: 30% 0; image-rendering: pixelated; }
</style>
</head>
<body>
<main>
  <p class="prompt">$ cd <b>../404</b></p>
  <p class="code" aria-hidden="true">404</p>
  <h1>Такой страницы нет</h1>
  <p>Похоже, ссылка устарела или в адресе опечатка. Канатная дорога всё равно ходит, а ассистент на месте.</p>
  <div class="links">
    <a class="btn" href="/app/"><span>Открыть ассистента</span></a>
    <a class="btn-ghost" href="/">На главную</a>
  </div>
</main>
<img src="/assets/skyline.svg" alt="" width="320" height="150">
</body>
</html>
