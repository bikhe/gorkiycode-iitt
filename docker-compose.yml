# Запуск на VPS:  DOMAIN=assistant.example.ru docker compose up -d --build
# DNS-запись домена должна указывать на сервер, порты 80 и 443 открыты.
name: assistant-ai  # явно: имя папки может быть не латиницей

services:
  app:
    build: .
    env_file: .env
    environment:
      APP_DB_PATH: /data/assistant_data.sqlite3
      # Кэши моделей — в томе: /app не доступна на запись, а .env задаёт локальную папку
      FASTEMBED_CACHE_PATH: /data/fastembed
      HF_HOME: /data/hf
      APP_CORS_ORIGIN: https://${DOMAIN:?укажите DOMAIN}
      APP_COOKIE_SECURE: "1"
      # Демо без регистрации: у каждого браузера свои записи (guest-id).
      # Чтобы включить вход по логину, задайте APP_AUTH_REQUIRED=1 в .env.
      APP_AUTH_REQUIRED: ${APP_AUTH_REQUIRED:-0}
    volumes:
      - app-data:/data          # база SQLite, кэш моделей Whisper и эмбеддингов
    expose:
      - "8765"
    restart: unless-stopped

  caddy:                        # HTTPS: без него браузер не даст микрофон
    image: caddy:2
    command: caddy reverse-proxy --from ${DOMAIN} --to app:8765
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data        # сертификаты Let's Encrypt
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
  caddy-data:
